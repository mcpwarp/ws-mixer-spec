name: spec

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node spec/tools/check-fixtures.mjs

  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node spec/tools/gen-relaxed-schema.mjs
      - run: git diff --exit-code -- spec/control.relaxed.schema.json

  runner-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build ./...
      - run: go vet ./...

  runner-selftest:
    runs-on: ubuntu-latest
    needs: runner-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./... -race
